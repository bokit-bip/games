<!DOCTYPE html>
<html>
<head>
  <title>EmulatorJS - N64</title>
  <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body, html {
      height: 100%;
      background-color: black;
      color: white;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }

    #box {
      color: #aaa;
      background-color: #333;
      border-radius: 0.4em;
      border: 2px solid #555;
      padding: 15px;
      text-align: center;
      width: 30em;
      max-width: 80%;
      transition: 0.2s;
      position: relative;
    }

    #box:hover, #box[drag] {
      border-color: #1AAFFF;
      color: #ddd;
    }

    #input {
      cursor: pointer;
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    .logo {
      width: 130px;
      height: 130px;
      filter: drop-shadow(0 0 8px white);
    }

    button {
      padding: 0.6em 0.8em;
      margin-top: 10px;
      font-size: 16px;
      background-color: #444;
      color: #aaa;
      border: 1px solid #555;
      border-radius: 0.4em;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #666;
      color: #fff;
    }
  </style>
</head>

<body>
  <h1>Nintendo 64 Emulator</h1>
  <img src="docs/Logo-light.png" alt="Logo" class="logo">
  <div id="box">
    <input type="file" id="input" accept=".n64,.z64,.v64,.zip">
    Drag & drop or click to load a Nintendo 64 ROM
    <br>
    <button id="autoLoad">Auto-load Default Game</button>
  </div>

  <script>
    const input = document.getElementById("input");
    const box = document.getElementById("box");
    const autoLoadBtn = document.getElementById("autoLoad");

    async function run(upload, file) {
      const url = upload ? input.files[0] : file;
      const name = upload ? input.files[0].name : file;
      const core = "n64";

      // Clean up UI
      document.body.innerHTML = "";
      const div = document.createElement("div");
      div.id = "display";
      const sub = document.createElement("div");
      sub.id = "game";
      div.appendChild(sub);
      document.body.appendChild(div);

      // EmulatorJS configuration
      window.EJS_player = "#game";
      window.EJS_gameName = name.split(".")[0];
      window.EJS_biosUrl = "";
      window.EJS_gameUrl = url;
      window.EJS_core = core;
      window.EJS_pathtodata = "data/";
      window.EJS_startOnLoaded = true;
      window.EJS_disableDatabases = true;

      const script = document.createElement("script");
      script.src = "data/loader.js"; // Make sure this path exists
      document.body.appendChild(script);
    }

    // Manual ROM load
    input.onchange = () => run(true);

    // Drag-and-drop support
    box.ondragover = () => box.setAttribute("drag", true);
    box.ondragleave = () => box.removeAttribute("drag");
    box.ondrop = (event) => {
      event.preventDefault();
      box.removeAttribute("drag");
      const file = event.dataTransfer.files[0];
      input.files = event.dataTransfer.files;
      run(true);
    };

    // Auto-load a default ROM (must exist in same folder)
    autoLoadBtn.onclick = () => {
      run(false, "Super Mario 64 (USA).z64");
    };
  </script>
</body>
</html>

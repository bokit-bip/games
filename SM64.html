<!DOCTYPE html>
<html>
<head>
  <title>Super Mario 64 (N64 Emulator)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
      background-color: black;
      color: white;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    h1 {
      margin-bottom: 20px;
      color: #ddd;
    }
    .logo {
      width: 130px;
      height: 130px;
      filter: drop-shadow(0 0 8px white);
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <h1>Loading Super Mario 64...</h1>
  <img src="docs/Logo-light.png" alt="Logo" class="logo">

  <script>
    async function runAutoGame() {
      // ✅ Your ROM filename — must be in same folder as this HTML file
      const gameFile = "Super Mario 64 (USA).z64";
      const core = "n64";

      // Clear loading UI
      document.body.innerHTML = "";
      const display = document.createElement("div");
      display.id = "display";
      const gameDiv = document.createElement("div");
      gameDiv.id = "game";
      display.appendChild(gameDiv);
      document.body.appendChild(display);

      // EmulatorJS configuration
      window.EJS_player = "#game";
      window.EJS_gameName = "Super Mario 64 (USA)";
      window.EJS_biosUrl = "";
      window.EJS_gameUrl = gameFile;
      window.EJS_core = core;
      window.EJS_pathtodata = "data/";
      window.EJS_startOnLoaded = true;
      window.EJS_disableDatabases = true;

      // Load the EmulatorJS engine
      const script = document.createElement("script");
      script.src = "data/loader.js"; // Path to EmulatorJS loader
      document.body.appendChild(script);
    }

    window.onload = runAutoGame;
  </script>
</body>
</html>
